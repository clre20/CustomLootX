# GUI 步驟精靈介面
# 所有箱子介面的標題、按鈕名稱與說明
# ------------------------------------------------------------------------------
gui:
  # 通用按鈕與導航文字
  common:
    filler-name: " "
    back-to-step1-name: "&e⬅ 上一步 &f(基本設定)"
    back-to-step1-lore:
      - "&7返回 [步驟 1/4] 修改名稱或材質"
