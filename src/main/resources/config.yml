# ==============================================================================
#                      CustomLootX 自訂可疑方塊插件 配置檔
# ==============================================================================

# 聊天室訊息前綴
prefix: "&8[&6CustomLootX&8] &r"

# ------------------------------------------------------------------------------
# 音效設定
# 支援原版 Minecraft 音效名稱，若無效則使用預設音效
# ------------------------------------------------------------------------------
sound:
  click: "UI_BUTTON_CLICK"           # 點擊介面按鈕時的音效
  success: "ENTITY_PLAYER_LEVELUP"   # 操作成功音效 (如升級、成功設定)
  error: "ENTITY_VILLAGER_NO"        # 發生錯誤或數值無效時的音效
  save: "BLOCK_ENCHANTMENT_TABLE_USE"# 步驟精靈儲存成功時的音效
  reset: "BLOCK_SAND_PLACE"          # 方塊自動重置復原時的音效

# ------------------------------------------------------------------------------
# 系統與戰鬥功能設定
# ------------------------------------------------------------------------------
settings:
  spawner:
    # 底部進度提示顯示文字格式 (%killed%: 已擊殺數, %total%: 目標總數, %active%: 場上存活數)
    actionbar-format: "&e試煉戰鬥中: &a%killed%/%total% &7(場上: &f%active% &7隻)"
    # 試煉完成提示音效設定 (可開啟/關閉，並自訂實際播放的音效，預設為關閉)
    victory-sound:
      enabled: false                       # 是否播放挑戰完成提示音效 (預設: false 關閉)
      sound: "UI_TOAST_CHALLENGE_COMPLETE" # 實際播放的音效名稱 (支援原版 Minecraft 音效名稱)
      volume: 1.0                          # 音效音量 (0.0 ~ 2.0)
      pitch: 1.2                           # 音效音調 (0.5 ~ 2.0)

  # 草稿暫存設定
  draft:
    # 草稿保留天數 (超過此天數自動清理檔案與標記過期，預設 7 天)
    expire-days: 7

# ------------------------------------------------------------------------------
# 聊天室訊息
# 出現於玩家/管理員執行指令、輸入數值或介面互動時的提示訊息
# ------------------------------------------------------------------------------
messages:
  # 權限不足提示
  no-permission: "&c你沒有權限執行此指令！"

  # 當指令只能由玩家執行
  only-player: "&c此指令只能由玩家執行！"

  # 找不到指定的配置檔案
  template-not-found: "&c找不到名為 &e%name% &c的配置！"

  # 配置檔案名稱已存在
  template-exists: "&c已存在名為 &e%name% &c的配置檔案！"

  # /clx create 執行成功時給予玩家的提示 (支援 %type% / %類型(中文)% 佔位符)
  template-created: "&a已創建自訂%type%方塊！"

  # /clx delete 刪除配置成功
  template-deleted: "&a已成功刪除配置 &e%name%&a！"

  # 步驟精靈儲存配置成功時
  save-success: "&a已成功儲存自訂可疑方塊配置: &e%name%&a！"

  # 步驟精靈儲存失敗時
  save-failed: "&c儲存失敗，請檢查後台日誌！"

  # 草稿自動暫存提示 (手持方塊)
  draft-saved: "&a已為您暫存當前編輯進度至手持方塊中（草稿保留 %days% 天）。"

  # 草稿自動暫存提示 (指令編輯)
  draft-saved-cmd: "&a已為您暫存當前編輯進度（草稿保留 %days% 天），下次輸入 &e/clx edit &a指令即可繼續編輯！"

  # 草稿還原提示 (手持方塊)
  draft-loaded: "&a已為您還原上次未儲存的草稿編輯進度！"

  # 草稿還原提示 (指令編輯)
  draft-loaded-cmd: "&a已為您載入 [%name%] 上次未儲存的暫存草稿！(若欲放棄草稿，可在最後確認介面點擊「放棄變更」)"

  # 草稿過期還原提示
  draft-expired-reverted: "&e此方塊的草稿已過期，已自動載入正式版本！"

  # 放棄變更關閉草稿提示
  save-cancelled: "&e已放棄變更並清理草稿暫存檔案。"

  # 嘗試放置草稿方塊被攔截提示
  cannot-place-draft: "&c此方塊包含尚未儲存的草稿！請手持對空氣點擊右鍵完成儲存後再放置。"

  # 掉落池總機率不等於 100% 時的錯誤提示
  sum-not-100: "&c儲存失敗！所有掉落物機率總和必須恰好為 100.00%（目前總和: &e%total%&c，差額: &e%diff%&c）！"

  # 玩家嘗試放置尚未完成設定的空白方塊時的警告
  empty-block-warning: "&c此方塊尚未完成設定！"

  # /clx give 給予成功提示
  give-success: "&a已給予玩家 &e%player% &f%amount% 個 &e[%name%] &a自訂可疑方塊！"

  # /clx give 目標玩家收到方塊時的提示
  receive-success: "&a你收到了 &f%amount% 個 &e[%name%] &a自訂可疑方塊！"

  # /clx give 給予自己時的補充操作提示
  give-self-tip: "&7(手持對空氣右鍵可重新編輯此配置，對地面右鍵可直接放置)"

  # /clx create 語法錯誤提示
  create-usage: "&c用法: /%label% create <suspicious|vault|spawner>"

  # /clx give 語法錯誤提示
  give-usage: "&c用法: /%label% give <suspicious|vault|spawner> <名稱> [給誰] [數量]"

  # 主控台執行 /clx give 未填寫目標玩家時的錯誤
  give-console-target-required: "&c主控台執行時必須指定目標玩家！用法: /%label% give <suspicious|vault|spawner> <名稱> <給誰> [數量]"

  # 找不到指定的目標玩家
  player-not-found: "&c找不到目標玩家: %player%"

  # /clx edit 語法錯誤提示
  edit-usage: "&c用法: /%label% edit <suspicious|vault|spawner> <名稱>"

  # /clx delete 語法錯誤提示
  delete-usage: "&c用法: /%label% delete <suspicious|vault|spawner> <名稱>"

  # /clx reload 重載成功提示
  reload-success: "&aCustomLootX 設定與所有資料重載完成！"

  # 創建全新寶庫草稿物品提示
  vault-template-created: "&a已創建全新自訂試煉寶庫！"

  # 寶庫鑰匙不符
  vault-key-mismatch: "&c解鎖失敗！此寶庫需要鑰匙: &e%key% &c才能開啟！"

  # 寶庫冷卻中
  vault-cooldown: "&c此寶庫冷卻中！剩餘 &e%time% &c後可再次開啟。"

  # 終生一次已領取
  vault-already-rewarded: "&c你已經開啟過此寶庫，無法再次領取戰利品！"

  # 鑰匙為空
  vault-key-empty: "&c請先在中間放入一把有效的鑰匙物品！"

  # 創建全新試煉生怪磚草稿物品提示
  spawner-template-created: "&a已創建全新自訂試煉生怪磚！"

  # 生怪磚冷卻中
  spawner-in-cooldown: "&c此試煉生怪磚冷卻中！剩餘 &e%time% 秒&c後可再次挑戰。"

  # 生怪磚終生一次已領取
  spawner-already-completed: "&c你已經完成過此試煉挑戰，無法再次領取獲勝獎勵！"

  # 生怪磚就緒提醒
  spawner-ready-hint: "&a此試煉生怪磚已就緒！進入感應範圍即可啟動挑戰 (怪物: &e%mob%&a)！"

  # 生怪磚戰鬥勝利
  spawner-victory: "&a✔ 恭喜完成試煉挑戰！獲勝獎勵已噴發！"

  # 生怪磚配置儲存成功
  spawner-save-success: "&a已成功儲存試煉生怪磚配置: &e%name%&a！"

  # 生怪磚生成模式切換提示
  spawner-mode-switched: "&8[&6CustomLootX&8] &a已切換生怪磚生成模式為: &e%mode%&a！"

  # 配置檔案儲存失敗
  template-save-failed: "&c儲存配置檔案失敗，請檢查主控台日誌！"

  # 聊天室輸入機率提示
  input-prompt: "&e請在聊天室輸入此物品的機率 (0.01 ~ 100.00)，輸入 &ccancel &e取消："

  # 聊天室輸入機率數值無效提示
  input-invalid: "&c輸入數值無效，請輸入介於 0.01 到 100.00 的有效數字（最多兩位小數）！"

  # 機率數值無效提示
  chance-invalid: "&c機率數值無效！請輸入介於 0.01 到 100.00 的有效數字。"

  # 怪物池機率總和非 100% 提示
  chance-not-100: "&c怪物池機率總和必須恰好為 100.00%（目前總和: &e%total%&c，差額: &e%diff%&c）！"

  # 聊天室調整機率成功提示
  input-success: "&a已將物品機率調整為: &e%chance%&a！"

  # 聊天室輸入配置名稱提示
  name-prompt: "&e請在聊天室輸入配置識別名稱 (英文字母、數字與底線)，輸入 &ccancel &e取消："

  # 尚未設定配置名稱提示
  name-not-set: "&c必須先設定有效的配置名稱！"

  # 聊天室輸入配置名稱無效提示
  name-invalid: "&c名稱無效！只能包含英文字母、數字與底線，且不能空白。"

  # 聊天室輸入的名稱已被其他配置使用提示
  name-already-used: "&c該名稱已被其他配置使用，請使用不同的名稱！"

  # 取消聊天室輸入提示
  input-cancelled: "&e已取消輸入操作。"

  # 聊天室輸入重置時間提示
  time-prompt: "&e請在聊天室輸入自動重置時間（單位：分鐘，請輸入大於等於 1 的整數），輸入 &ccancel &e取消："

  # 重置時間小於 1 分鐘時的錯誤提示
  time-min-invalid: "&c時間必須至少為 1 分鐘！"

  # 重置時間非整數時的錯誤提示
  time-invalid: "&c請輸入有效的整數數字！"

  # 聊天室輸入每次彈出數量提示
  roll-prompt: "&e請在聊天室輸入每次彈出數量 (1 ~ 64)，輸入 &ccancel &e取消："

  # 彈出數量無效提示
  roll-invalid: "&c彈出數量無效！請輸入介於 1 到 64 的整數。"

  # 聊天室輸入鑰匙自訂名稱提示
  key-name-prompt: "&e請在聊天室輸入鑰匙自訂名稱 (支援彩色代碼 &)，輸入 &ccancel &e取消："

  # 聊天室輸入鑰匙說明提示
  key-lore-prompt: "&e請在聊天室輸入鑰匙自訂說明 (支援彩色代碼 &)，輸入 &ccancel &e取消："

  # 成功製作防偽鑰匙提示
  key-craft-success: "&a已成功製作專屬防偽鑰匙！已將 1 把鑰匙發送至您的背包。"

  # 複製外觀成功
  key-copy-success: "&a已成功套用手持物品的外觀材質與模型！"

  # 複製外觀未拿物品
  key-copy-empty: "&c請先用滑鼠手持物品後再點擊此格以複製外觀！"

  # /clx key 語法提示
  cmd-key-usage: "&c用法: /%label% key <寶庫名稱> [玩家] [數量]"

  # 給予鑰匙成功提示
  cmd-key-give: "&a已給予玩家 &e%player% &f%amount% 把 &e[%name%] &a專屬防偽鑰匙！"

  # 收到鑰匙提示
  cmd-key-receive: "&a你收到了 &f%amount% 把 &e[%name%] &a專屬防偽鑰匙！"

# ------------------------------------------------------------------------------
# 指令清單輸出
# 用於 /clx help 與 /clx list 指令的輸出外觀
# ------------------------------------------------------------------------------
commands:
  help:
    header: "&8============ &6CustomLootX 指令清單 &8============"
    create: "&e/%label% create <suspicious|vault> &7- 創建全新空白可疑方塊或試煉寶庫"
    give: "&e/%label% give <suspicious|vault> <名稱> [給誰] [數量] &7- 取得或給予已設定好的方塊"
    key: "&e/%label% key <寶庫名稱> [給誰] [數量] &7- 發放指定寶庫的專屬防偽鑰匙"
    edit: "&e/%label% edit <suspicious|vault> <名稱> &7- 直接開啟指定配置的步驟引導介面"
    list: "&e/%label% list &7- 列出所有已儲存的可疑方塊配置"
    delete: "&e/%label% delete <名稱> &7- 刪除指定的配置檔案"
    reload: "&e/%label% reload &7- 重新讀取設定與資料檔"
    footer: "&8=============================================="

  list:
    header: "&8========== &6CustomLootX 已儲存配置清單 &8=========="
    empty: "&7目前沒有任何已儲存的配置。使用 &e/%label% create &7創建一個！"
    item: "&f- &e%name% &7(%type%&7) %chance% %reset% &7- 包含 &f%count% &7件物品"
    type-sand: "&e沙"
    type-gravel: "&7礫"
    valid-chance: "&a[100.00%]"
    invalid-chance: "&c[%chance%]"
    reset-on: "&b[重置: %minutes%m]"
    reset-off: "&8[無重置]"
    footer: "&8=================================================="

